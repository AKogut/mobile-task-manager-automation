version: 2

# Three npm projects (the root holds the repository tooling, app/ the React
# Native app, appium-tests/ the cross-platform suite), the app's Ruby toolchain
# for CocoaPods, and the workflows.
#
# Held back on purpose:
#
#   React Native   — react-native and the packages released in lockstep with it
#                    (@react-native/*, the community CLI) take patch updates
#                    only, together in one PR. A React Native minor is a
#                    migration across the native templates, Pods and Gradle,
#                    done with the upgrade helper rather than as a bump.
#   React          — react and react-test-renderer move only with React Native,
#                    never on their own: React Native bundles its renderer for
#                    one exact React version and refuses to start with any
#                    other, even a patch apart.
#   Gradle         — not tracked. The Android build takes its plugin versions
#                    from React Native's Gradle plugin, so it moves with the
#                    React Native upgrade, not on its own.
#   eslint         — majors in app/ wait for React Native: the app lints with
#                    @react-native/eslint-config's legacy configuration
#                    (ESLINT_USE_FLAT_CONFIG=false).
#   TypeScript     — majors in app/ wait for React Native too: a TypeScript
#                    outside the range of the typescript-eslint that
#                    @react-native/eslint-config uses breaks the lint.
#   @types/node    — majors follow the Node version in .nvmrc.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      tooling:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      react-native:
        patterns:
          - 'react-native'
          - '@react-native/*'
          - '@react-native-community/cli*'
      app:
        update-types: [minor, patch]
    ignore:
      - dependency-name: 'react-native'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react'
      - dependency-name: 'react-test-renderer'
      - dependency-name: '@react-native/*'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native-community/cli*'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /appium-tests
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # WebdriverIO releases every package in lockstep, so all of them move in
      # one PR, majors included. An update lands in the first group it matches.
      wdio:
        patterns: ['webdriverio', '@wdio/*']
      appium-tests:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: bundler
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    groups:
      ruby:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
    groups:
      github-actions:
        patterns: ['*']
