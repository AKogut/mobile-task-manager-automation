name: iOS Simulator App Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ios-simulator-app:
    name: Build iOS Simulator app
    runs-on: macos-latest

    env:
      IOS_APP_ZIP: MobileTaskManager-ios-simulator.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: app

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: bundle exec pod install

      - name: Build iOS Simulator app
        working-directory: app/ios
        run: |
          xcodebuild \
            -workspace MobileTaskManager.xcworkspace \
            -scheme MobileTaskManager \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS Simulator app
        run: |
          mkdir -p release-assets
          APP_PATH="app/ios/build/ios-simulator/Build/Products/Debug-iphonesimulator/MobileTaskManager.app"
          test -d "${APP_PATH}"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "release-assets/${IOS_APP_ZIP}"

      - name: Upload iOS Simulator app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-app
          path: release-assets/${{ env.IOS_APP_ZIP }}

      - name: Attach iOS Simulator app to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release-assets/${{ env.IOS_APP_ZIP }}
          generate_release_notes: true
