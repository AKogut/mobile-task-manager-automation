name: Nightly E2E

on:
  workflow_dispatch:
    inputs:
      appium_ios:
        description: Run Appium iOS suite
        required: false
        default: true
        type: boolean
      appium_android:
        description: Run Appium Android suite
        required: false
        default: true
        type: boolean
      xcuitest:
        description: Run native iOS XCUITest suite
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: nightly-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  appium:
    name: Appium
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.appium_ios || inputs.appium_android }}
    uses: ./.github/workflows/appium-suite.yml
    with:
      platform: >-
        ${{
          (github.event_name != 'workflow_dispatch' || (inputs.appium_ios && inputs.appium_android)) && 'both'
          || (inputs.appium_ios && 'ios')
          || (inputs.appium_android && 'android')
          || 'none'
        }}

  xcuitest:
    name: XCUITest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.xcuitest }}
    uses: ./.github/workflows/xcuitest-suite.yml

  report:
    name: Aggregate reports
    needs: [appium, xcuitest]
    if: |
      always() &&
      (needs.appium.result != 'skipped' || needs.xcuitest.result != 'skipped')
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.detect.outputs.any }}

    steps:
      - name: Download Appium Android results
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: allure-results-android
          path: allure-results

      - name: Download Appium iOS results
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: allure-results-ios
          path: allure-results

      - name: Download XCUITest HTML report
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: xcuitest-report
          path: xcuitest-report

      - name: Detect available results
        id: detect
        run: |
          ANDROID=false
          IOS=false
          IOS_NATIVE=false
          ANY=false
          [ -d allure-results/android ] && ANDROID=true
          [ -d allure-results/ios ] && IOS=true
          [ -f xcuitest-report/report.html ] && IOS_NATIVE=true
          if [ "$ANDROID" = true ] || [ "$IOS" = true ] || [ "$IOS_NATIVE" = true ]; then ANY=true; fi
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"
          echo "ios_native=$IOS_NATIVE" >> "$GITHUB_OUTPUT"
          echo "any=$ANY" >> "$GITHUB_OUTPUT"

      - name: Set up Java (required by Allure CLI)
        if: steps.detect.outputs.ios == 'true' || steps.detect.outputs.android == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI
        if: steps.detect.outputs.ios == 'true' || steps.detect.outputs.android == 'true'
        run: npm install -g allure-commandline

      - name: Generate Appium Android report
        if: steps.detect.outputs.android == 'true'
        run: allure generate allure-results/android --clean -o site/android

      - name: Generate Appium iOS report
        if: steps.detect.outputs.ios == 'true'
        run: allure generate allure-results/ios --clean -o site/ios

      - name: Assemble XCUITest report
        if: steps.detect.outputs.ios_native == 'true'
        run: |
          mkdir -p site/ios-native
          cp xcuitest-report/report.html site/ios-native/index.html

      - name: Build landing page
        if: steps.detect.outputs.any == 'true'
        env:
          ANDROID_RAN: ${{ steps.detect.outputs.android }}
          IOS_RAN: ${{ steps.detect.outputs.ios }}
          IOS_NATIVE_RAN: ${{ steps.detect.outputs.ios_native }}
        run: |
          mkdir -p site
          IOS_CARD=""
          ANDROID_CARD=""
          IOS_NATIVE_CARD=""
          if [ "$IOS_RAN" = "true" ]; then
            IOS_CARD='<a class="card" href="./ios/"><span class="p">Appium iOS</span><span class="h">XCUITest driver</span></a>'
          fi
          if [ "$ANDROID_RAN" = "true" ]; then
            ANDROID_CARD='<a class="card" href="./android/"><span class="p">Appium Android</span><span class="h">UiAutomator2</span></a>'
          fi
          if [ "$IOS_NATIVE_RAN" = "true" ]; then
            IOS_NATIVE_CARD='<a class="card" href="./ios-native/"><span class="p">Native iOS</span><span class="h">XCUITest</span></a>'
          fi
          cat > site/index.html << EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Mobile Task Manager — E2E Reports</title>
              <style>
                body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; }
                main { text-align: center; padding: 2rem; }
                h1 { margin: 0 0 .25rem; }
                p { color: #94a3b8; margin: 0; }
                .cards { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-top: 2rem; }
                .card { min-width: 200px; padding: 1.5rem 2rem; border-radius: 16px; background: #1e293b; color: #e2e8f0; text-decoration: none; border: 1px solid #334155; transition: transform .15s, border-color .15s; }
                .card:hover { transform: translateY(-3px); border-color: #6366f1; }
                .p { display: block; font-size: 1.25rem; font-weight: 700; }
                .h { display: block; color: #94a3b8; font-size: .9rem; margin-top: .25rem; }
              </style>
            </head>
            <body>
              <main>
                <h1>Mobile Task Manager — E2E Reports</h1>
                <p>Nightly end-to-end suites</p>
                <div class="cards">$IOS_CARD$ANDROID_CARD$IOS_NATIVE_CARD</div>
              </main>
            </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        if: steps.detect.outputs.any == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy combined report to GitHub Pages
    needs: report
    if: github.ref == 'refs/heads/main' && needs.report.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
