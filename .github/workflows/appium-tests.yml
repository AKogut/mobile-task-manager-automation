name: Appium E2E Tests

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run tests on
        required: true
        default: both
        type: choice
        options:
          - both
          - ios
          - android

concurrency:
  group: appium-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-android:
    name: Android tests (API 35)
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      APPIUM_ANDROID_AVD: Nexus6_API_35
      APPIUM_ANDROID_DEVICE_NAME: emulator-5554
      APPIUM_ANDROID_APP_PATH: ${{ github.workspace }}/app/android/app/build/outputs/apk/release/app-release.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64

      - name: Install test dependencies
        working-directory: appium-tests
        run: npm ci

      - name: Install Appium drivers
        working-directory: appium-tests
        run: node_modules/.bin/appium driver install uiautomator2

      - name: Create Android test runner script
        run: |
          cat > /tmp/run-android-tests.sh << 'EOF'
          #!/usr/bin/env bash
          set -eo pipefail

          APPIUM_PID=""

          cleanup() {
            [ -n "$APPIUM_PID" ] && kill "$APPIUM_PID" 2>/dev/null || true
            adb -s emulator-5554 emu kill 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Waiting for package manager..."
          DEADLINE=$(( $(date +%s) + 120 ))
          until adb -s emulator-5554 shell pm list packages 2>/dev/null | grep -q "^package:"; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "Package manager did not become ready within 120s — continuing anyway"
              break
            fi
            sleep 3
          done
          echo "Package manager ready."
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP 2>/dev/null || true
          adb -s emulator-5554 shell wm density 320 2>/dev/null || true

          cd "$GITHUB_WORKSPACE/appium-tests"
          node_modules/.bin/appium --log "$GITHUB_WORKSPACE/appium-android.log" &
          APPIUM_PID=$!
          sleep 10

          EXIT_CODE=0
          npm run test:android || EXIT_CODE=$?
          exit $EXIT_CODE
          EOF
          chmod +x /tmp/run-android-tests.sh

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          avd-name: Nexus6_API_35
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          disable-animations: true
          script: bash /tmp/run-android-tests.sh

      - name: Upload Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android
          path: appium-tests/allure-results
          retention-days: 7

      - name: Upload Appium log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log-android
          path: appium-android.log
          retention-days: 3

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-android
          path: appium-tests/screenshots
          retention-days: 3

  test-ios:
    name: iOS tests (iPhone 16)
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-15
    timeout-minutes: 75

    env:
      APPIUM_IOS_APP_PATH: ${{ github.workspace }}/app/ios/build/Build/Products/Debug-iphonesimulator/MobileTaskManager.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: app

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: bundle exec pod install

      - name: Select available iOS simulator
        run: |
          SIM_JSON=$(xcrun simctl list devices available -j)

          SIM_UDID=$(echo "$SIM_JSON" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for rt, devs in d['devices'].items():
              for dev in devs:
                  if 'iPhone 16' in dev['name'] and dev['isAvailable']:
                      print(dev['udid'])
                      sys.exit()
          " 2>/dev/null || echo "")

          if [ -z "$SIM_UDID" ]; then
            SIM_UDID=$(echo "$SIM_JSON" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for rt, devs in d['devices'].items():
              for dev in devs:
                  if 'iPhone' in dev['name'] and dev['isAvailable']:
                      print(dev['udid'])
                      sys.exit()
          " 2>/dev/null || echo "")
          fi

          DEVICE_NAME=$(echo "$SIM_JSON" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for rt, devs in d['devices'].items():
              for dev in devs:
                  if dev.get('udid') == '$SIM_UDID':
                      print(dev['name'])
                      sys.exit()
          " 2>/dev/null || echo "iPhone 16")

          PLATFORM_VERSION=$(echo "$SIM_JSON" | python3 -c "
          import sys, json, re
          d = json.load(sys.stdin)
          for rt, devs in d['devices'].items():
              for dev in devs:
                  if dev.get('udid') == '$SIM_UDID':
                      m = re.search(r'iOS-(\d+)-(\d+)', rt)
                      if m:
                          print(m.group(1) + '.' + m.group(2))
                      sys.exit()
          " 2>/dev/null || echo "18.5")

          echo "APPIUM_IOS_UDID=$SIM_UDID"           >> "$GITHUB_ENV"
          echo "APPIUM_IOS_DEVICE_NAME=$DEVICE_NAME" >> "$GITHUB_ENV"
          echo "APPIUM_IOS_PLATFORM_VERSION=$PLATFORM_VERSION" >> "$GITHUB_ENV"
          echo "Selected: $DEVICE_NAME ($SIM_UDID) — iOS $PLATFORM_VERSION"

      - name: Boot iOS simulator
        run: |
          xcrun simctl boot "$APPIUM_IOS_UDID" || true
          xcrun simctl bootstatus "$APPIUM_IOS_UDID" -b
          SIMULATOR_APP="$(xcode-select -p)/Applications/Simulator.app"
          open -Fn "$SIMULATOR_APP" --args -CurrentDeviceUDID "$APPIUM_IOS_UDID"
          sleep 5

      - name: Build iOS app (bundle embedded — no Metro required)
        working-directory: app/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace MobileTaskManager.xcworkspace \
            -scheme MobileTaskManager \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$APPIUM_IOS_UDID" \
            -derivedDataPath build \
            FORCE_BUNDLING=YES \
            CODE_SIGNING_ALLOWED=NO \
            build \
            2>&1 | tee /tmp/xcodebuild.log

      - name: Install test dependencies
        working-directory: appium-tests
        run: npm ci

      - name: Install Appium drivers
        working-directory: appium-tests
        run: npx appium driver install xcuitest

      - name: Pre-build WebDriverAgent
        run: |
          WDA_PROJECT=$(find appium-tests/node_modules -name "WebDriverAgent.xcodeproj" | head -1)
          echo "WDA project: $WDA_PROJECT"
          xcodebuild build-for-testing \
            -project "$WDA_PROJECT" \
            -scheme WebDriverAgentRunner \
            -destination "platform=iOS Simulator,id=$APPIUM_IOS_UDID" \
            -derivedDataPath /tmp/wda-build \
            CODE_SIGNING_ALLOWED=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=0 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee /tmp/wda-build.log
          echo "WDA_DERIVED_DATA=/tmp/wda-build" >> "$GITHUB_ENV"

      - name: Start Appium server
        working-directory: appium-tests
        run: |
          npx appium --log ../appium-ios.log &
          echo "APPIUM_PID=$!" >> "$GITHUB_ENV"
          sleep 10

      - name: Run iOS tests
        working-directory: appium-tests
        run: npm run test:ios

      - name: Stop Appium server
        if: always()
        run: kill "$APPIUM_PID" 2>/dev/null || true

      - name: Upload Allure results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ios
          path: appium-tests/allure-results
          retention-days: 7

      - name: Upload Appium log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log-ios
          path: appium-ios.log
          retention-days: 3

      - name: Upload WDA build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wda-build-log
          path: /tmp/wda-build.log
          retention-days: 3

      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          retention-days: 3

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ios
          path: appium-tests/screenshots
          retention-days: 3

  report:
    name: Publish Allure report
    needs: [test-android, test-ios]
    if: |
      always() &&
      (needs.test-android.result != 'skipped' || needs.test-ios.result != 'skipped')
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.detect.outputs.any }}

    steps:
      - name: Download Android results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-results-android
          path: allure-results

      - name: Download iOS results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ios
          path: allure-results

      - name: Detect available results
        id: detect
        run: |
          ANDROID=false
          IOS=false
          ANY=false
          [ -d allure-results/android ] && ANDROID=true
          [ -d allure-results/ios ] && IOS=true
          if [ "$ANDROID" = true ] || [ "$IOS" = true ]; then ANY=true; fi
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"
          echo "any=$ANY" >> "$GITHUB_OUTPUT"

      - name: Set up Java (required by Allure CLI)
        if: steps.detect.outputs.any == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI
        if: steps.detect.outputs.any == 'true'
        run: npm install -g allure-commandline

      - name: Generate Android report
        if: steps.detect.outputs.android == 'true'
        run: allure generate allure-results/android --clean -o site/android

      - name: Generate iOS report
        if: steps.detect.outputs.ios == 'true'
        run: allure generate allure-results/ios --clean -o site/ios

      - name: Build landing page
        if: steps.detect.outputs.any == 'true'
        env:
          ANDROID_RAN: ${{ steps.detect.outputs.android }}
          IOS_RAN: ${{ steps.detect.outputs.ios }}
        run: |
          mkdir -p site
          IOS_CARD=""
          ANDROID_CARD=""
          if [ "$IOS_RAN" = "true" ]; then
            IOS_CARD='<a class="card" href="./ios/"><span class="p">iOS</span><span class="h">XCUITest</span></a>'
          fi
          if [ "$ANDROID_RAN" = "true" ]; then
            ANDROID_CARD='<a class="card" href="./android/"><span class="p">Android</span><span class="h">UiAutomator2</span></a>'
          fi
          cat > site/index.html << EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Mobile Task Manager — Appium Reports</title>
              <style>
                body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; }
                main { text-align: center; padding: 2rem; }
                h1 { margin: 0 0 .25rem; }
                p { color: #94a3b8; margin: 0; }
                .cards { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-top: 2rem; }
                .card { min-width: 200px; padding: 1.5rem 2rem; border-radius: 16px; background: #1e293b; color: #e2e8f0; text-decoration: none; border: 1px solid #334155; transition: transform .15s, border-color .15s; }
                .card:hover { transform: translateY(-3px); border-color: #6366f1; }
                .p { display: block; font-size: 1.25rem; font-weight: 700; }
                .h { display: block; color: #94a3b8; font-size: .9rem; margin-top: .25rem; }
              </style>
            </head>
            <body>
              <main>
                <h1>Appium E2E Reports</h1>
                <p>Mobile Task Manager — Allure</p>
                <div class="cards">$IOS_CARD$ANDROID_CARD</div>
              </main>
            </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        if: steps.detect.outputs.any == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy report to GitHub Pages
    needs: report
    if: github.ref == 'refs/heads/main' && needs.report.outputs.any == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
