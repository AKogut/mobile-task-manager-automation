name: Appium E2E Tests

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to run tests on
        required: true
        default: both
        type: choice
        options:
          - both
          - ios
          - android

concurrency:
  group: appium-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

# ──────────────────────────────────────────────────────────────
# Android
# ──────────────────────────────────────────────────────────────
jobs:
  test-android:
    name: Android tests (API 35)
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest

    env:
      APPIUM_ANDROID_AVD: Pixel_8_API_35
      APPIUM_ANDROID_DEVICE_NAME: emulator-5554
      APPIUM_ANDROID_APP_PATH: ${{ github.workspace }}/app/android/app/build/outputs/apk/debug/app-debug.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"

      - name: Create AVD
        run: |
          echo no | avdmanager create avd \
            --name Pixel_8_API_35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_8" \
            --force

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build debug APK
        # assembleDebug bundles the JS — no Metro needed.
        working-directory: app/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64

      - name: Install Appium and drivers
        # Pin uiautomator2 to v2.x — v3.x requires Appium 3.x which is
        # incompatible with the Appium 2.x server used in this project.
        run: |
          npm install -g appium
          appium driver install uiautomator2@2

      - name: Install test dependencies
        working-directory: appium-tests
        run: npm ci

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          avd-name: Pixel_8_API_35
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            appium --log appium-android.log &
            APPIUM_PID=$!
            sleep 8
            cd appium-tests && npm run test:android
            EXIT_CODE=$?
            kill $APPIUM_PID 2>/dev/null || true
            exit $EXIT_CODE

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android
          path: appium-tests/allure-results
          retention-days: 7

      - name: Upload Appium log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log-android
          path: appium-android.log
          retention-days: 3

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-android
          path: appium-tests/screenshots
          retention-days: 3

  # ──────────────────────────────────────────────────────────────
  # iOS
  # ──────────────────────────────────────────────────────────────
  test-ios:
    name: iOS tests (iPhone 16)
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-15

    env:
      APPIUM_IOS_DEVICE_NAME: iPhone 16
      APPIUM_IOS_PLATFORM_VERSION: '18.4'
      APPIUM_IOS_APP_PATH: ${{ github.workspace }}/app/ios/build/Build/Products/Debug-iphonesimulator/MobileTaskManager.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: app

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: bundle exec pod install

      - name: Select available iOS simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available -j \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for rt, devs in d['devices'].items():
              for dev in devs:
                  if 'iPhone 16' in dev['name'] and dev['isAvailable']:
                      print(dev['udid'])
                      sys.exit()
          " 2>/dev/null || echo "")

          if [ -z "$SIM_UDID" ]; then
            echo "iPhone 16 not found, using first available iPhone"
            SIM_UDID=$(xcrun simctl list devices available -j \
              | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for rt, devs in d['devices'].items():
              for dev in devs:
                  if 'iPhone' in dev['name'] and dev['isAvailable']:
                      print(dev['udid'])
                      sys.exit()
          ")
          fi

          DEVICE_NAME=$(xcrun simctl list devices available \
            | grep "$SIM_UDID" | sed 's/ (.*//;s/^[[:space:]]*//')
          PLATFORM_VERSION=$(xcrun simctl list devices available -j \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for rt, devs in d['devices'].items():
              for dev in devs:
                  if dev.get('udid') == '$SIM_UDID':
                      ver = rt.split('.')[-2] + '.' + rt.split('.')[-1]
                      print(ver)
                      sys.exit()
          " 2>/dev/null || echo "18.4")

          echo "APPIUM_IOS_UDID=$SIM_UDID" >> $GITHUB_ENV
          echo "APPIUM_IOS_DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_ENV
          echo "APPIUM_IOS_PLATFORM_VERSION=$PLATFORM_VERSION" >> $GITHUB_ENV
          echo "Selected simulator: $DEVICE_NAME ($SIM_UDID) — iOS $PLATFORM_VERSION"

      - name: Boot iOS simulator
        run: |
          xcrun simctl boot "$APPIUM_IOS_UDID" || true
          xcrun simctl bootstatus "$APPIUM_IOS_UDID" -b

      - name: Build iOS app (bundle embedded — no Metro required)
        working-directory: app/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace MobileTaskManager.xcworkspace \
            -scheme MobileTaskManager \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$APPIUM_IOS_UDID" \
            -derivedDataPath build \
            FORCE_BUNDLING=YES \
            CODE_SIGNING_ALLOWED=NO \
            build \
            2>&1 | tee /tmp/xcodebuild.log

      - name: Install Appium and drivers
        working-directory: appium-tests
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Install test dependencies
        working-directory: appium-tests
        run: npm ci

      - name: Start Appium server
        run: |
          appium --log appium-ios.log &
          echo "APPIUM_PID=$!" >> $GITHUB_ENV
          sleep 8

      - name: Run iOS tests
        working-directory: appium-tests
        run: npm run test:ios

      - name: Stop Appium server
        if: always()
        run: kill $APPIUM_PID 2>/dev/null || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ios
          path: appium-tests/allure-results
          retention-days: 7

      - name: Upload Appium log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appium-log-ios
          path: appium-ios.log
          retention-days: 3

      - name: Upload xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          retention-days: 3

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ios
          path: appium-tests/screenshots
          retention-days: 3

  # ──────────────────────────────────────────────────────────────
  # Report — merge results from both platforms → GitHub Pages
  # ──────────────────────────────────────────────────────────────
  report:
    name: Publish Allure report
    needs: [test-android, test-ios]
    if: |
      always() &&
      (needs.test-android.result != 'skipped' || needs.test-ios.result != 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Download Android results
        if: needs.test-android.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: allure-results-android
          path: allure-results

      - name: Download iOS results
        if: needs.test-ios.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: allure-results-ios
          path: allure-results

      - name: Set up Java (required by Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure HTML report
        run: allure generate allure-results --clean -o allure-report

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
