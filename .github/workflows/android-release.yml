name: Android APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest

    env:
      APK_NAME: MobileTaskManager-debug.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Prepare APK asset
        run: |
          mkdir -p release-assets
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "release-assets/${APK_NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: release-assets/${{ env.APK_NAME }}

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release-assets/${{ env.APK_NAME }}
          generate_release_notes: true
