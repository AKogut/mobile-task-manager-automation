name: Espresso suite (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  espresso:
    name: Espresso (Android Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Verify generated test ids are current
        run: |
          npm run android:test:testids
          if ! git diff --quiet -- android-tests/src/androidTest/kotlin/com/mobiletaskmanager/TestIds.kt; then
            echo 'TestIds.kt is out of date. Run "npm run android:test:testids" and commit the result.' >&2
            git --no-pager diff -- android-tests/src/androidTest/kotlin/com/mobiletaskmanager/TestIds.kt
            exit 1
          fi

      - name: Run Espresso suite on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          avd-name: Nexus6_API_35
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          disable-animations: true
          script: cd app/android && ./gradlew :app:connectedAndroidTest -PreactNativeArchitectures=x86_64 --console=plain

      - name: Upload HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: espresso-report
          path: app/android/app/build/reports/androidTests/connected/uitest
          retention-days: 7

      - name: Upload JUnit results and logcat
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: espresso-results
          path: app/android/app/build/outputs/androidTest-results/connected/uitest
          retention-days: 7
