name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  app-quality:
    name: App lint, typecheck, and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        working-directory: app
        run: npm test -- --runInBand

  appium-tests-quality:
    name: Appium tests lint and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            appium-tests/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install Appium test dependencies
        working-directory: appium-tests
        run: npm ci --ignore-scripts

      - name: Lint
        run: npx eslint --config eslint.config.mjs --max-warnings 0 "appium-tests/**/*.ts"

      - name: Typecheck
        working-directory: appium-tests
        run: npm run typecheck
